services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-002}
      TZ: ${TZ:-UTC}
      STOCKWORKS_DATA_DIR: ${STOCKWORKS_DATA_DIR:-/data}
      STOCKWORKS_DB_FILENAME: ${STOCKWORKS_DB_FILENAME:-app.db}
      DATABASE_URL: ${DATABASE_URL:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD?ADMIN_PASSWORD is required}
      SECRET_KEY: ${SECRET_KEY?SECRET_KEY is required}
      BAMBU_VIEW_BASE_URL: ${BAMBU_VIEW_BASE_URL:-}
      BAMBU_VIEW_API_KEY: ${BAMBU_VIEW_API_KEY:-}
      BAMBU_VIEW_API_AUTH_HEADER: ${BAMBU_VIEW_API_AUTH_HEADER:-X-API-Key}
      BAMBU_VIEW_ADMIN_USERNAME: ${BAMBU_VIEW_ADMIN_USERNAME:-}
      BAMBU_VIEW_ADMIN_PASSWORD: ${BAMBU_VIEW_ADMIN_PASSWORD:-}
      BAMBU_VIEW_TRACE: ${BAMBU_VIEW_TRACE:-0}
    restart: unless-stopped
