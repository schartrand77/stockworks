services:
  api:
    container_name: stockworks
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-002}
      TZ: ${TZ:-UTC}
      STOCKWORKS_DATA_DIR: ${STOCKWORKS_DATA_DIR:-/data}
      STOCKWORKS_DB_FILENAME: ${STOCKWORKS_DB_FILENAME:-app.db}
      DATABASE_URL: ${DATABASE_URL:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD?ADMIN_PASSWORD is required}
      SECRET_KEY: ${SECRET_KEY?SECRET_KEY is required}
      PRINTLAB_BASE_URL: ${PRINTLAB_BASE_URL:-}
      PRINTLAB_API_KEY: ${PRINTLAB_API_KEY:-}
      PRINTLAB_BEARER_TOKEN: ${PRINTLAB_BEARER_TOKEN:-}
      PRINTLAB_USERNAME: ${PRINTLAB_USERNAME:-}
      PRINTLAB_PASSWORD: ${PRINTLAB_PASSWORD:-}
      PRINTLAB_API_AUTH_HEADER: ${PRINTLAB_API_AUTH_HEADER:-X-API-Key}
      PRINTLAB_TRACE: ${PRINTLAB_TRACE:-0}
    restart: unless-stopped
    networks:
      - makerworks-net

networks:
  makerworks-net:
    name: makerworks-net
    external: true
